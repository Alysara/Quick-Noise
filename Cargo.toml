[workspace]
resolver = "3"
members = ["."]

[package]
name = "quick-noise"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
debug = "line-tables-only"
strip = false

[profile.bench]
opt-level = 3
debug = "line-tables-only"
strip = false

[dependencies]
num-traits = "0.2.19"
image = { version = "0.25.9", default-features = false, features = ["png"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_arrays = { version = "0.2", optional = true }
paste = "1.0.15"
itertools = "0.14.0"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
fastnoise2 = "0.4.0"
noise = "0.9.0"
libnoise = "1.2.0"
noiz = "0.5.0"
simdnoise = "3.1.6"
fastnoise-lite = "1.1.1" # bonus: common cross-language reference impl
bevy_math = "0.19.0"

[features]
image = ["dep:image"]
serde = ["dep:serde", "dep:serde_arrays"]

[[bench]]
name = "perlin"
harness = false

[[bench]]
name = "value"
harness = false

[[bench]]
name = "simplex"
harness = false

[[bench]]
name = "cellular"
harness = false

[[bench]]
name = "grid"
harness = false

[[bench]]
name = "batch"
harness = false

[[example]]
name = "basic"
required-features = ["image"]
