[workspace]
resolver = "3"
members = ["."]

[package]
name = "quick-noise"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Alysara/quick-noise"
keywords = ["noise", "simd", "simplex", "perlin", "performance"]
categories = ["game-engines", "multimedia::images"]
readme = "README.md"
description = "Blazingly fast SIMD procedural noise library for batch and uniform grid sampling. Works on stable Rust."
rust-version = "1.95"
exclude = ["images/"]

[profile.release]
opt-level = 3
debug = "line-tables-only"
strip = false

[profile.bench]
opt-level = 3
debug = "line-tables-only"
strip = false

[dependencies]
num-traits = "0.2.19"
itertools = "0.14.0"
image = { version = "0.25.9", default-features = false, features = ["png"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_arrays = { version = "0.2", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
paste = "1.0.15"
fastnoise2 = "0.4.0"
noise = "0.9.0"
libnoise = "1.2.0"
noiz = "0.5.0"
simdnoise = "3.1.6"
bevy_math = "0.19.0"
noise-functions = "0.8.5"

[features]
image = ["dep:image"]
serde = ["dep:serde", "dep:serde_arrays"]

[[bench]]
name = "perlin"
harness = false

[[bench]]
name = "value"
harness = false

[[bench]]
name = "simplex"
harness = false

[[bench]]
name = "cellular"
harness = false

[[bench]]
name = "grid"
harness = false

[[bench]]
name = "batch"
harness = false

[[example]]
name = "basic"
required-features = ["image"]
