name: Rust

on:
  push:
    branches: [ "dynamic-dispatch" ]
  pull_request:
    branches: [ "dynamic-dispatch" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  x86:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: scalar
            rustflags: ""
            run_tests: true
          - name: sse
            rustflags: "-C target-feature=+sse,+sse2,+sse3,+sse4.1,+sse4.2"
            run_tests: true
          - name: avx2
            rustflags: "-C target-feature=+avx,+avx2,+fma"
            run_tests: true
          - name: avx512
            rustflags: "-C target-feature=+avx512f,+avx512bw,+avx512vl,+avx512dq"
            run_tests: false 
    steps:
      - uses: actions/checkout@v4
      - name: Build (${{ matrix.name }})
        run: cargo build --verbose --features="image"
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - name: Test (${{ matrix.name }})
        if: matrix.run_tests
        run: cargo test --verbose --features="image"
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

  arm-neon:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build (neon)
        run: cargo build --verbose --features="image"
        env:
          RUSTFLAGS: "-C target-feature=+neon"
      - name: Test (neon)
        run: cargo test --verbose --features="image"
        env:
          RUSTFLAGS: "-C target-feature=+neon"
